[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-assistant"
version = "0.1.0"
description = "Model-independent subtitle project tools and optional AI translation backends"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
subtitle-assistant = "subtitle_translator.tool:main"

[project.optional-dependencies]
legacy = ["PyYAML>=6.0", "python-dotenv>=1.0", "requests>=2.31", "ollama>=0.3"]
marian = ["subtitle-assistant[legacy]", "torch>=2.0", "transformers>=4.30", "sentencepiece>=0.1.96"]
gemini = ["subtitle-assistant[legacy]", "google-genai>=1.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
contracts = ["jsonschema>=4.18", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
include = ["subtitle_translator*"]

[tool.setuptools.package-data]
subtitle_translator = ["web/*.html", "web/*.css", "web/*.js", "web/*.mjs"]
